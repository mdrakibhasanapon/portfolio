<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function(){
      var p = window.location.pathname;
      if (p.indexOf('/home') !== -1) {
        window.location.replace('/portfolio/home');
      } else {
        window.location.replace('/portfolio/');
      }
    })();
  </script>
</head>
<body>
</body>
</html>
