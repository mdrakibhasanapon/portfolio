<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function(){
      var p = window.location.pathname;
      var base = p.startsWith('/portfolio') ? '/portfolio' : '';
      var match = p.match(/\/(home|about|work|achievements|education|contact)\/?$/i);
      if (match) {
        window.location.replace(base + '/' + match[1].toLowerCase());
      } else {
        window.location.replace(base + '/');
      }
    })();
  </script>
</head>
<body>
</body>
</html>
